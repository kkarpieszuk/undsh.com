<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>undsh.com clean up AI text</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --border: #2d3a47;
      --text: #e8edf2;
      --muted: #8b9aad;
      --accent: #5eb3f6;
      --accent-hover: #7ec4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }

    .lead {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      min-height: 10rem;
      padding: 0.875rem 1rem;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 179, 246, 0.2);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    .toggle-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .toggle-btn:hover {
      background: #25313d;
    }

    .toggle-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: transparent;
      color: var(--bg);
    }

    .toggle-btn[aria-pressed="true"]::before {
      content: "✓ ";
      font-weight: 700;
    }

    .output-wrap {
      margin-top: 1.5rem;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .output-header label {
      margin-bottom: 0;
    }

    .output {
      min-height: 3rem;
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }

    .output:empty::before {
      content: "…";
      color: var(--muted);
    }

    button {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.65rem 1.25rem;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(94, 179, 246, 0.35);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .copy-btn {
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 1.5rem;
    }

    .hint code {
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
      font-size: 0.88em;
      padding: 0.12em 0.35em;
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);

    }

    .consent-banner {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: min(42rem, calc(100% - 2rem));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
      z-index: 20;
    }

    .consent-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      flex: 1 1 20rem;
    }

    .consent-actions {
      display: flex;
      gap: 0.5rem;
    }

    .consent-btn {
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .consent-btn.reject {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <h1>undsh.com</h1>
    <p class="lead">Using AI to generate text? Here you can clean it up by removing em dashes and emoji.</p>

    <div>
      <label for="input">Paste your text</label>
      <textarea id="input" placeholder="Paste or type your text here…" autocomplete="off" spellcheck="true"></textarea>
      <div class="tools" aria-label="Text cleanup options">
        <button type="button" id="toggle-dash" class="toggle-btn" aria-pressed="true">un-em-dash</button>
        <button type="button" id="toggle-emoji" class="toggle-btn" aria-pressed="false">de-emojify</button>
      </div>
    </div>

    <div class="output-wrap">
      <div class="output-header">
        <label for="preview">Result</label>
        <button type="button" id="copy" class="copy-btn" disabled hidden>Copy result to clipboard</button>
      </div>
      <div id="preview" class="output" aria-live="polite"></div>
    </div>

    <p class="hint"><strong>Tip:</strong> Paste your text in the box at the top, or add it to the page URL right after a <code>#</code>.</p>
  </main>

  <div id="consent-banner" class="consent-banner" hidden>
    <p class="consent-text">This site uses cookies.</p>
    <div class="consent-actions">
      <button type="button" id="consent-reject" class="consent-btn reject">Reject</button>
      <button type="button" id="consent-accept" class="consent-btn">Accept</button>
    </div>
  </div>

  <script>
    const GA_ID = "G-0DSMDPGGCT";
    const CONSENT_KEY = "undsh.analyticsConsent";
    const EM_DASH = "\u2014";
    const LEADING_EMOJI_RE = /^(?:\s*[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?(?:\u200D[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?)*)+/u;
    const ALL_EMOJI_RE = /(?:[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?(?:\u200D[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?)*)/gu;
    const SPACE_PLUS_EMOJI_RE = /[ \t]+(?:[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?(?:\u200D[\p{Extended_Pictographic}\p{Emoji_Presentation}](?:\uFE0F|\uFE0E)?)*)/gu;
    const input = document.getElementById("input");
    const preview = document.getElementById("preview");
    const copyBtn = document.getElementById("copy");
    const consentBanner = document.getElementById("consent-banner");
    const consentRejectBtn = document.getElementById("consent-reject");
    const consentAcceptBtn = document.getElementById("consent-accept");
    const toggleDashBtn = document.getElementById("toggle-dash");
    const toggleEmojiBtn = document.getElementById("toggle-emoji");
    const options = {
      unEmDash: true,
      unEmojify: false,
    };

    function replaceDashes(text) {
      return text.split(EM_DASH).join("-");
    }

    function stripEmoji(text) {
      return text
        .split("\n")
        .map((line) => {
          const hadLeadingEmoji = LEADING_EMOJI_RE.test(line);
          const withoutEmoji = line
            .replace(SPACE_PLUS_EMOJI_RE, "")
            .replace(ALL_EMOJI_RE, "");
          return hadLeadingEmoji ? `-${withoutEmoji}` : withoutEmoji;
        })
        .join("\n");
    }

    function syncToggleButtons() {
      toggleDashBtn.setAttribute("aria-pressed", String(options.unEmDash));
      toggleEmojiBtn.setAttribute("aria-pressed", String(options.unEmojify));
    }

    function enableAnalytics() {
      if (window.gtag) return;
      const script = document.createElement("script");
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function gtag() {
        window.dataLayer.push(arguments);
      };
      window.gtag("js", new Date());
      window.gtag("config", GA_ID);
    }

    function setAnalyticsConsent(value) {
      localStorage.setItem(CONSENT_KEY, value);
      consentBanner.hidden = true;
      if (value === "accepted") enableAnalytics();
    }

    function initConsent() {
      const current = localStorage.getItem(CONSENT_KEY);
      if (current === "accepted") {
        enableAnalytics();
        consentBanner.hidden = true;
        return;
      }
      if (current === "rejected") {
        consentBanner.hidden = true;
        return;
      }
      consentBanner.hidden = false;
    }

    function textFromLocationHash() {
      const encoded = location.hash.slice(1);
      if (!encoded) return null;
      try {
        return decodeURIComponent(encoded);
      } catch {
        return encoded;
      }
    }

    function applyHashToInput() {
      const decoded = textFromLocationHash();
      if (decoded !== null) input.value = decoded;
      refresh();
      if (decoded === null) input.focus();
    }

    function refresh() {
      const raw = input.value;
      let out = raw;
      if (options.unEmDash) out = replaceDashes(out);
      if (options.unEmojify) out = stripEmoji(out);
      preview.textContent = out;
      const isEmpty = out.length === 0;
      copyBtn.hidden = isEmpty;
      copyBtn.disabled = isEmpty;
    }

    input.addEventListener("input", refresh);
    toggleDashBtn.addEventListener("click", () => {
      options.unEmDash = !options.unEmDash;
      syncToggleButtons();
      refresh();
    });
    toggleEmojiBtn.addEventListener("click", () => {
      options.unEmojify = !options.unEmojify;
      syncToggleButtons();
      refresh();
    });

    window.addEventListener("hashchange", applyHashToInput);
    consentAcceptBtn.addEventListener("click", () => setAnalyticsConsent("accepted"));
    consentRejectBtn.addEventListener("click", () => setAnalyticsConsent("rejected"));

    copyBtn.addEventListener("click", async () => {
      const text = preview.textContent;
      if (!text) return;
      const label = copyBtn.textContent;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = "Copied, now paste it anywhere you want";
        setTimeout(() => {
          copyBtn.textContent = "Copy result to clipboard";
        }, 1600);
      } catch {
        copyBtn.textContent = "Copy failed";
        setTimeout(() => {
          copyBtn.textContent = label;
        }, 2000);
      }
    });

    syncToggleButtons();
    applyHashToInput();
    initConsent();
  </script>
</body>
</html>
